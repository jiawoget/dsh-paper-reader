<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Paper Reader</title>
  <link rel="preload" href="./assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="./app.js?v=596ccd719dbb">
  <link rel="stylesheet" href="./reader.bundle.css?v=2a48a47cd2e2">
</head>
<body>
  <main id="reader">
    <section class="workspace" aria-label="Reading area">
      <header class="topbar">
        <button id="library" class="icon-btn" aria-label="Open library" title="Library and imports"></button>
        <button id="contentsToggle" class="icon-btn" type="button" aria-controls="contentsPanel" aria-expanded="false">Contents</button>
        <div class="doc-heading"><strong id="docTitle">Paper Reader</strong><span id="docMeta"></span></div>
        <div class="toolbar" aria-label="Reading tools">
          <div class="jump-history" role="group" aria-label="Jump history">
            <button id="jumpBack" type="button" class="icon-btn" aria-label="Jump back" disabled></button>
            <button id="jumpForward" type="button" class="icon-btn" aria-label="Jump forward" disabled></button>
          </div>
          <div class="page-navigation">
            <button id="prev" aria-label="Previous page" class="icon-btn" disabled></button>
            <button id="pageCount" type="button" aria-label="Go to page" title="Go to page" popovertarget="pageJump" disabled></button>
            <button id="next" aria-label="Next page" class="icon-btn" disabled></button>
          </div>
          <div id="articleNavigation" hidden>
            <button id="previousSection" type="button" class="icon-btn" aria-label="Previous section" hidden></button>
            <button id="nextSection" type="button" class="icon-btn" aria-label="Next section" hidden></button>
          </div>
          <div id="zoomControl"><label for="zoom" class="menu-zoom-label"></label><button id="zoomOut" type="button" class="icon-btn zoom-step" aria-label="Decrease scale" title="Decrease scale"></button><select id="zoom" aria-label="Zoom"><option value="fit-page">Fit page</option><option value="0.75">75%</option><option value="1">Fit width</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoomIn" type="button" class="icon-btn zoom-step" aria-label="Increase scale" title="Increase scale"></button></div>
          <div id="pdfThemeControl"><button id="pdfThemeBtn" type="button" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="pdfThemeMenu" popovertarget="pdfThemeMenu" aria-label="PDF paper theme" title="PDF paper theme"><span class="pdf-theme-glyph" aria-hidden="true">Aa</span><span class="pdf-theme-label">PDF paper theme</span></button></div>
          <div class="reader-mode-switch" role="group" aria-label="Reading mode"><button id="originalMode" type="button" aria-pressed="true"><span class="mode-full">Original</span><span class="mode-compact" aria-hidden="true">Orig</span></button><button id="parallel" type="button" aria-pressed="false"><span class="mode-wide">Bilingual</span><span class="mode-narrow">Translation</span><span class="mode-compact" aria-hidden="true">Trans</span></button></div>
        </div>
        <button id="captureRegion" class="btn" type="button" aria-pressed="false" hidden></button>
        <button id="mobileRail" class="icon-btn" aria-label="Show notes" aria-controls="rail" aria-expanded="false"></button>
        <button id="more" class="icon-btn" aria-label="More actions" aria-controls="menu" aria-expanded="false"></button>
        <nav id="menu" aria-label="Reader actions" hidden></nav>
        <form id="pageJump" popover aria-label="Go to page">
          <label for="pageNumber">Page number</label>
          <div><input id="pageNumber" type="number" min="1" step="1" inputmode="numeric" aria-describedby="pageLimit" required autofocus><span id="pageLimit"></span><button class="btn primary" type="submit">Go</button></div>
        </form>
        <div id="pdfThemeMenu" class="pdf-theme-menu" role="menu" popover="auto" aria-label="PDF paper theme"></div>
      </header>
      <div id="pageFormat" hidden><span id="pageTextHint"></span><button id="placePin" class="btn" type="button">Add page note</button><button id="readText" class="btn" type="button" aria-controls="original">Read text</button></div>
      <div class="headings"><span><b>Original</b><small id="sourceInfo"></small></span><span class="target-heading" id="pinHeading"><span><b>Translation</b><small id="translationInfo" hidden></small></span><select id="targetLang" aria-label="Translation language" title="Translation language"></select><select id="translationMode" aria-label="Translation scope" title="Translation scope"><option value="page">Full page</option><option value="column">Active column</option><option value="passage">Active passage</option></select><button id="retranslatePage" class="btn" type="button" hidden>Re-translate</button></span></div>
      <div id="paperScroll" tabindex="0" aria-label="Document pages">
        <div class="pages"><div class="lane"><div id="original"></div></div><div id="pageSplit" class="desk-split" role="separator" tabindex="0" aria-label="Resize original and translation" aria-orientation="vertical" aria-controls="original translated" title="Resize original and translation"></div><div class="lane translated"><div id="translated"></div></div></div>
        <div id="loading" role="status">Opening document…</div>
      </div>
      <section id="selectionDock" aria-label="Passage workspace" hidden>
        <div id="passageSplit" role="separator" tabindex="0" aria-orientation="horizontal" aria-controls="card"></div>
      </section>
      <div id="mobileBar" class="mobile-bar" hidden></div>
      <button id="returnDiscussion" class="btn" type="button" hidden></button>
    </section>
    <div id="notesSplit" class="desk-split" role="separator" tabindex="0" aria-label="Resize notes" aria-orientation="vertical" aria-controls="rail" title="Resize notes"></div>
    <div id="notebookBackdrop" aria-hidden="true" hidden></div>
    <aside id="rail" aria-label="Reading notes">
      <div class="notebook-titlebar">
        <h2 id="notebookHandle" tabindex="-1">Notes</h2>
        <select id="notebookPose" class="sidebar-position" aria-label="Notes position"></select>
        <button id="closeRail" type="button" class="icon-btn" aria-label="Close notes" title="Close notes"></button>
      </div>
      <header class="rail-head">
        <div role="tablist" aria-label="Reading sidebar"><button id="contentsTab" role="tab" aria-controls="contentsPanel" aria-selected="false" tabindex="-1">Contents</button><button id="notesTab" role="tab" aria-selected="true" aria-controls="railBody">Notes</button><button id="annotationsTab" role="tab" aria-controls="railBody" aria-selected="false" tabindex="-1">Marks</button><button id="refsTab" role="tab" aria-selected="false" aria-controls="railBody" tabindex="-1">Reference</button></div>
      </header>
      <label class="highlight-preference" for="highlightDisplay" hidden><span>Highlights</span>
        <select id="highlightDisplay" aria-label="Highlight display"><option value="inline">In Notes</option><option value="separate">In Marks only</option></select>
      </label>
      <div id="railBody" role="tabpanel" aria-labelledby="notesTab"></div>
      <div id="contentsPanel" role="tabpanel" aria-labelledby="contentsTab" hidden></div>
    </aside>
  </main>
  <section id="card" aria-label="Selection card" hidden></section>
  <dialog id="dialog" aria-labelledby="dialogTitle"><header><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-btn" aria-label="Close dialog"></button></header><div id="dialogBody"></div></dialog>
  <dialog id="shortcutsDialog" aria-labelledby="shortcutsTitle"><header><h2 id="shortcutsTitle">Keyboard shortcuts</h2><button id="closeShortcuts" type="button" class="icon-btn" aria-label="Close keyboard shortcuts"></button></header><div id="shortcutsBody"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./app.js?v=596ccd719dbb"></script>
</body>
</html>
